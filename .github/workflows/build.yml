name: Build & Test NexText APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Build Release APK"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        run: gradle --no-daemon testGithubDebugUnitTest testFdroidDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon assembleGithubDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexText-Debug-APK
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/nextext-release.jks"
            export KEYSTORE_FILE="${{ runner.temp }}/nextext-release.jks"
          fi
          gradle --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Upload Release APK artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NexText-Release-APK
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app/build/outputs/apk/github/release/*.apk
          generate_release_notes: true
